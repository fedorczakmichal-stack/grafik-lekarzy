<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>OAiIT 2026 — ładowanie atlasu pacjentów</title>
<style>
html,body{height:100%;margin:0;background:#06111f;color:#f3f8fd;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:520px;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 20px 60px rgba(0,0,0,.35)}.spinner{width:48px;height:48px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#4ad8b8;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}p{color:#9eb1c5;margin:0}.err{color:#ff9aa6;margin-top:14px;font-size:13px}</style>
</head>
<body><div class="wrap"><div class="card"><div class="spinner"></div><h1>Ładowanie nowej wersji raportu</h1><p>Atlas 53 pacjentów i analiza kohorty.</p><div class="err" id="err"></div></div></div>
<script>
(async()=>{try{const v='20260711-v2';const urls=Array.from({length:7},(_,i)=>`v2/part-${i+1}.txt?${v}`);const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${u}: ${r.status}`);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('err').textContent='Nie udało się załadować raportu. Odśwież stronę za chwilę. '+e.message}})();
</script></body></html>
